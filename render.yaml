services:
  - type: web
    name: hydropip-pip-api
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/pip/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: PIP_ALLOWED_ORIGINS
        value: https://www.hydropip.com,https://hydropip.com,https://hydropip-pip-api.onrender.com
      - key: PIP_FREE_MODE
        value: true
      - key: PIP_PRO_SIGNUP_URL
        value: https://www.hydropip.com/pip?pro=1
      - key: OPENAI_API_KEY
        sync: false
      - key: PIP_BRIDGE_SECRET
        sync: false
      - key: PIP_ADMIN_KEY
        sync: false
      - key: PIP_ADMIN_ALLOWED_IPS
        sync: false
      - key: PIP_ADMIN_IP_MODE
        value: observe
      - key: PIP_REQUIRE_SIGNED_SESSIONS
        value: true
      - key: DATABASE_URL
        sync: false
      - key: PIP_SESSION_TTL_SECONDS
        value: 3600
      - key: PIP_REQUIRE_EXCHANGE_NONCE
        value: true
      - key: PIP_ENABLE_ADMIN_UI
        value: true
      - key: PIP_FEEDBACK_AI_ENABLED
        value: true
      - key: PIP_FEEDBACK_AI_TIMEOUT_MS
        value: 15000
      - key: PIP_MODEL
        value: gpt-5-mini
      - key: PIP_VISITOR_DAILY_AI_CREDITS
        value: 5
      - key: PIP_FREE_MEMBER_DAILY_AI_CREDITS
        value: 20
      - key: PIP_PRO_DAILY_AI_CREDITS
        value: 150
      - key: PIP_VISITOR_MONTHLY_AI_CREDITS
        value: 100
      - key: PIP_FREE_MEMBER_MONTHLY_AI_CREDITS
        value: 400
      - key: PIP_PRO_MONTHLY_AI_CREDITS
        value: 3000
      - key: PIP_GLOBAL_MONTHLY_AI_CREDITS
        value: 100000
      - key: PIP_TEXT_CREDIT_COST
        value: 1
      - key: PIP_DETAILED_CREDIT_COST
        value: 3
      - key: PIP_PHOTO_CREDIT_COST
        value: 10
      - key: PIP_AI_DISABLED
        value: false
      - key: PIP_MODEL_INPUT_COST_PER_MILLION
        value: 0.25
      - key: PIP_MODEL_OUTPUT_COST_PER_MILLION
        value: 2.00
      - key: PIP_MAX_PROMPT_CHARS
        value: 6000
      - key: PIP_MAX_HISTORY_MESSAGES
        value: 24
      - key: PIP_MAX_HISTORY_CHARS
        value: 24000
      - key: PIP_FREE_MEMBER_MAX_IMAGE_BYTES
        value: 2097152
      - key: PIP_PRO_MAX_IMAGE_BYTES
        value: 5242880
