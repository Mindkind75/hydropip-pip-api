<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pip Training Dashboard</title>
  <style>
    :root{--ink:#13211d;--muted:#5d6c66;--leaf:#1f7a4f;--deep:#0f4f37;--mint:#dff1e5;--paper:#f7f5ef;--line:rgba(19,33,29,.14);--gold:#b97a18;--bad:#9d3027;--panel:#fff}
    *{box-sizing:border-box}body{margin:0;background:#eef7f0;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .shell{min-height:100vh;display:grid;grid-template-columns:300px minmax(0,1fr)}
    aside{padding:24px 18px;background:var(--deep);color:#fff}aside h1{margin:0 0 8px;font-size:2.15rem;line-height:.96}aside p{margin:0 0 18px;color:#d7e9de;line-height:1.45}.controls{display:grid;gap:12px}.field{display:grid;gap:6px;font-size:.82rem;font-weight:900}.field span{color:#d7e9de}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font:inherit}input,select{min-height:42px;padding:8px 10px}textarea{min-height:86px;padding:10px;resize:vertical}button{min-height:42px;padding:9px 13px;border:0;border-radius:7px;background:var(--leaf);color:#fff;font-weight:950;cursor:pointer}button.secondary{background:#24483b}button.light{background:#fff;color:var(--deep)}button.warn{background:var(--gold)}button:disabled{background:#718179;cursor:default}
    main{min-width:0;padding:22px}.top{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:14px}.top h2{margin:0;font-size:clamp(1.8rem,4vw,3rem);line-height:1}.status{min-height:22px;color:var(--deep);font-weight:850}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.stat{padding:13px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}.stat strong{display:block;font-size:1.45rem}.stat small{color:var(--muted);font-weight:850}
    .grid{display:grid;grid-template-columns:minmax(280px,420px) minmax(0,1fr);gap:14px;align-items:start}.queue,.workbench{min-height:calc(100vh - 156px);border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.92);box-shadow:0 18px 44px rgba(19,33,29,.1);overflow:hidden}.queue-head,.work-head{padding:14px;border-bottom:1px solid var(--line);background:#fff}.queue-list{display:grid;gap:8px;padding:12px;max-height:calc(100vh - 220px);overflow:auto}.queue-item{display:grid;gap:6px;width:100%;padding:11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);text-align:left}.queue-item.active{border-color:var(--leaf);box-shadow:0 0 0 3px rgba(31,122,79,.14)}.queue-item strong{line-height:1.25}.queue-item small{color:var(--muted);font-weight:800}.badges{display:flex;gap:5px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;min-height:24px;padding:3px 7px;border-radius:999px;background:var(--mint);color:var(--deep);font-size:.72rem;font-weight:950;text-transform:capitalize}.badge.high{background:#fff2cf;color:var(--gold)}.badge.urgent{background:#ffe1dc;color:var(--bad)}
    .workbench{display:grid;grid-template-rows:auto minmax(0,1fr)}.work-body{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;padding:14px;overflow:auto}.card{border:1px solid var(--line);border-radius:8px;background:#fff;padding:14px}.card h3{margin:0 0 10px}.question{margin:0 0 10px;font-size:1.1rem;font-weight:950;line-height:1.35}.answer,.meta{white-space:pre-wrap;color:var(--muted);line-height:1.45}.meta{max-height:230px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:7px;background:#f9fbf9;font-size:.82rem}.training{display:grid;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.empty{padding:28px;text-align:center;color:var(--muted)}
    @media(max-width:980px){.shell{grid-template-columns:1fr}aside{position:static}.grid,.work-body,.stats{grid-template-columns:1fr}.queue,.workbench{min-height:auto}.queue-list{max-height:360px}}
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <h1>Pip Training</h1>
      <p>Review stuck answers, approve the better response, and decide what should change.</p>
      <div class="controls">
        <label class="field"><span>Admin key</span><input id="adminKey" type="password" autocomplete="off" placeholder="PIP_ADMIN_KEY"></label>
        <label class="field"><span>Status</span><select id="statusFilter"><option value="new">New</option><option value="reviewing">Reviewing</option><option value="reviewed">Reviewed</option><option value="resolved">Resolved</option><option value="">All</option></select></label>
        <label class="field"><span>Limit</span><select id="limitFilter"><option>50</option><option>100</option><option>250</option></select></label>
        <button id="loadButton" type="button" class="light">Load Dashboard</button>
      </div>
    </aside>
    <main>
      <div class="top">
        <div><h2>Review Queue</h2><p class="status" id="statusText"></p></div>
      </div>
      <section class="stats" id="stats"></section>
      <section class="grid">
        <div class="queue">
          <div class="queue-head"><strong>Questions</strong></div>
          <div class="queue-list" id="queueList"><div class="empty">Load the dashboard to begin.</div></div>
        </div>
        <div class="workbench">
          <div class="work-head"><strong id="workTitle">Training workbench</strong></div>
          <div class="work-body" id="workBody"><div class="empty">Select a question to review.</div></div>
        </div>
      </section>
    </main>
  </div>
  <script>
    const keyInput=document.getElementById("adminKey"),statusFilter=document.getElementById("statusFilter"),limitFilter=document.getElementById("limitFilter"),loadButton=document.getElementById("loadButton"),statusText=document.getElementById("statusText"),stats=document.getElementById("stats"),queueList=document.getElementById("queueList"),workBody=document.getElementById("workBody"),workTitle=document.getElementById("workTitle");
    let items=[],selectedId=null;const savedKey=localStorage.getItem("pipReviewAdminKey");if(savedKey)keyInput.value=savedKey;loadButton.addEventListener("click",loadDashboard);
    async function loadDashboard(){const key=keyInput.value.trim();if(!key){statusText.textContent="Enter the admin key first.";return}localStorage.setItem("pipReviewAdminKey",key);statusText.textContent="Loading...";try{const params=new URLSearchParams();if(statusFilter.value)params.set("status",statusFilter.value);params.set("limit",limitFilter.value);const response=await fetch("/api/pip/admin/review-items?"+params.toString(),{headers:{"X-Pip-Admin-Key":key}});if(!response.ok)throw new Error("Review API returned "+response.status);const data=await response.json();items=data.reviewItems||[];selectedId=items[0]?.id||null;render()}catch(error){statusText.textContent=error.message}}
    function render(){statusText.textContent=items.length?items.length+" item"+(items.length===1?"":"s")+" loaded.":"No items in this view.";renderStats();renderQueue();renderWorkbench(items.find((item)=>item.id===selectedId))}
    function renderStats(){const groups={new:0,reviewing:0,reviewed:0,resolved:0};items.forEach((item)=>{groups[item.status]=Number(groups[item.status]||0)+1});stats.innerHTML=["new","reviewing","reviewed","resolved"].map((key)=>`<div class="stat"><strong>${groups[key]||0}</strong><small>${key}</small></div>`).join("")}
    function renderQueue(){queueList.innerHTML=items.length?"":'<div class="empty">Nothing waiting here.</div>';items.forEach((item)=>{const button=document.createElement("button");button.className="queue-item"+(item.id===selectedId?" active":"");button.type="button";button.innerHTML=`<div class="badges"><span class="badge">${escapeHtml(item.status||"new")}</span><span class="badge ${escapeHtml(item.priority||"normal")}">${escapeHtml(item.priority||"normal")}</span></div><strong></strong><small>${escapeHtml(item.reason||"needs_review")} | ${item.createdAt?new Date(item.createdAt).toLocaleString():""}</small>`;button.querySelector("strong").textContent=item.question||"(No question saved)";button.addEventListener("click",()=>{selectedId=item.id;render()});queueList.appendChild(button)})}
    function renderWorkbench(item){if(!item){workTitle.textContent="Training workbench";workBody.innerHTML='<div class="empty">Select a question to review.</div>';return}workTitle.textContent="Review "+item.id;workBody.innerHTML=`<section class="card"><h3>User Question</h3><p class="question"></p><h3>Pip Attempt</h3><p class="answer"></p><h3>Context</h3><pre class="meta"></pre></section><aside class="card training"><h3>Training Helper</h3><label class="field"><span>Issue type</span><select id="issueType"><option value="knowledge_gap">Knowledge gap</option><option value="bad_intent">Misunderstood intent</option><option value="missing_context">Needed follow-up question</option><option value="tool_gap">Tool/action gap</option><option value="bad_affiliate">Wrong product/link</option><option value="calendar_error">Calendar/reminder error</option><option value="no_change">No change needed</option></select></label><label class="field"><span>Approved ideal answer</span><textarea id="idealAnswer" placeholder="Write the answer Pip should give next time."></textarea></label><label class="field"><span>Training update</span><select id="trainingUpdate"><option value="knowledge_base">Add to knowledge base</option><option value="prompt_rule">Add prompt/routing rule</option><option value="tool_fix">Create or fix a tool</option><option value="affiliate_fix">Update product/link rule</option><option value="calendar_fix">Update calendar workflow</option><option value="no_change">No change</option></select></label><div class="two"><label class="field"><span>Status</span><select id="nextStatus"><option value="reviewed">Reviewed</option><option value="resolved">Resolved</option><option value="reviewing">Reviewing</option><option value="new">New</option></select></label><label class="field"><span>Priority</span><select id="priority"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option><option value="low">Low</option></select></label></div><label class="field"><span>Internal note</span><textarea id="internalNote" placeholder="Why this matters, edge cases, or where to update Pip."></textarea></label><div class="actions"><button id="saveReview" type="button">Approve Training Note</button><button id="markReviewing" type="button" class="secondary">Mark Reviewing</button></div></aside>`;workBody.querySelector(".question").textContent=item.question||"(No question saved)";workBody.querySelector(".answer").textContent=item.answer||"No answer was saved.";workBody.querySelector(".meta").textContent=JSON.stringify(item.context||{},null,2);const existing=parseResolution(item.resolution);document.getElementById("issueType").value=existing.issueType||"knowledge_gap";document.getElementById("idealAnswer").value=existing.idealAnswer||"";document.getElementById("trainingUpdate").value=existing.trainingUpdate||"knowledge_base";document.getElementById("nextStatus").value=item.status==="new"?"reviewed":item.status||"reviewed";document.getElementById("priority").value=item.priority||"normal";document.getElementById("internalNote").value=existing.internalNote||"";document.getElementById("saveReview").addEventListener("click",()=>saveItem(item.id));document.getElementById("markReviewing").addEventListener("click",()=>quickStatus(item.id,"reviewing"))}
    async function saveItem(id){const payload={issueType:value("issueType"),idealAnswer:value("idealAnswer"),trainingUpdate:value("trainingUpdate"),internalNote:value("internalNote"),approvedAt:new Date().toISOString()};await patchItem(id,{status:value("nextStatus"),priority:value("priority"),resolution:JSON.stringify(payload,null,2)})}
    async function quickStatus(id,status){await patchItem(id,{status})}
    async function patchItem(id,patch){const button=document.activeElement;if(button)button.disabled=true;try{const response=await fetch("/api/pip/admin/review-items/"+encodeURIComponent(id),{method:"PATCH",headers:{"Content-Type":"application/json","X-Pip-Admin-Key":keyInput.value.trim()},body:JSON.stringify({patch})});if(!response.ok)throw new Error("Save returned "+response.status);statusText.textContent="Saved.";await loadDashboard()}catch(error){statusText.textContent=error.message}finally{if(button)button.disabled=false}}
    function value(id){return document.getElementById(id).value.trim()}
    function parseResolution(text){try{return JSON.parse(text||"{}")}catch(_error){return{internalNote:text||""}}}
    function escapeHtml(value){return String(value||"").replace(/[&<>"']/g,(char)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]))}
  </script>
</body>
</html>
