<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Monthly growth report | HydroPip</title>
<style>body{font:16px/1.5 system-ui;background:#f4f7f3;color:#183b2c;max-width:1100px;margin:auto;padding:24px}button,input,a{font:inherit}button,input{padding:10px;margin:8px 8px 8px 0}table{border-collapse:collapse;width:100%;background:white}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}section{overflow:auto}pre{white-space:pre-wrap}a{color:#176640}</style></head>
<body><a href="/admin-control-center">Back to Control Center</a><h1>Monthly growth report</h1><p>Existing app activity by campaign. New registrations and paid subscriptions must be reconciled with Wix; affiliate earnings come from Amazon.</p>
<label>Month (Eastern time) <input id="month" type="month" required></label><button id="load">Load report</button><button id="download" disabled>Download JSON</button><p id="status" role="status"></p><section id="result"></section>
<script>
let report=null;const el=id=>document.getElementById(id);const now=new Date(),parts=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit'}).formatToParts(now),y=Number(parts.find(p=>p.type==='year').value),m=Number(parts.find(p=>p.type==='month').value);el('month').value=new Date(Date.UTC(y,m-2,1)).toISOString().slice(0,7);
const events=['page_view','primary_build_cta_clicked','affiliate_link_clicked','signup_started','member_session_connected','build_estimate_saved','grow_first_saved','pip_pro_cta_clicked','pro_checkout_started','facebook_follow_clicked'];
el('load').onclick=async()=>{el('load').disabled=true;el('download').disabled=true;el('result').replaceChildren();report=null;el('status').textContent='Loading…';try{const response=await fetch('/api/pip/admin/growth-report?month='+encodeURIComponent(el('month').value),{credentials:'same-origin',cache:'no-store'});if(response.status===401||response.status===403)throw Error('Unlock Control Center first, then return to this report.');if(!response.ok)throw Error('Report unavailable. Check the selected month and try again.');report=await response.json();el('status').textContent=report.totalEvents+' recorded events; '+report.uniqueVisitors+' observed visitors. '+(report.coverage.truncated?'WARNING: event limit reached; report is incomplete. ':'')+(report.coverage.ownerExclusionsConfigured?'Configured owner/test exclusions applied.':'Owner traffic is not excluded. Classify it before drawing acquisition conclusions.');const table=document.createElement('table'),head=table.createTHead().insertRow();['Source / campaign / post','Observed visitors',...events].forEach(x=>{const th=document.createElement('th');th.textContent=x.replaceAll('_',' ');head.append(th)});for(const row of report.campaigns){const tr=table.insertRow();[ [row.source,row.campaign,row.content].filter(Boolean).join(' / '),row.uniqueVisitors,...events.map(e=>row.counts[e]||0)].forEach(x=>{const td=tr.insertCell();td.textContent=x})}el('result').append(table);const p=document.createElement('p');p.textContent=report.coverage.limitations.join(' ');el('result').append(p);el('download').disabled=false;}catch(error){el('status').textContent=error.message;}finally{el('load').disabled=false}};
el('download').onclick=()=>{if(!report)return;const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(report,null,2)],{type:'application/json'}));a.href=url;a.download='hydropip-growth-'+report.month+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></body></html>
