<script>
(function () {
  if (location.pathname !== "/pip") return;

  var base = "https://hydropip-pip-api.onrender.com";
  var icon = base + "/assets/app-icons/hydropip-build-180.png";

  function setMeta(name, content) {
    var node = document.querySelector('meta[name="' + name + '"]');
    if (!node) {
      node = document.createElement("meta");
      node.name = name;
      document.head.appendChild(node);
    }
    node.content = content;
  }

  function setLink(rel, href, sizes) {
    var node = document.querySelector('link[data-hydropip-app="' + rel + '"]');
    if (!node) {
      node = document.createElement("link");
      node.rel = rel;
      node.dataset.hydropipApp = rel;
      document.head.appendChild(node);
    }
    node.href = href;
    if (sizes) node.sizes = sizes;
  }

  setMeta("theme-color", "#f7f5ef");
  setLink("apple-touch-icon", icon, "180x180");
  setLink("icon", icon, "180x180");
})();
</script>
